[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pr-verification-agent"
version = "0.1.0"
description = "Evidence-backed pull request verification control plane and deterministic core."
readme = "docs/verification-semantics.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Doddi Yashwanth Soma Ganesh" }]
dependencies = [
    "PyYAML>=6.0.2",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
integration = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "PyJWT[crypto]>=2.8.0",
    "google-genai>=1.0.0",
    "uvicorn>=0.30.0",
    "SQLAlchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
]
dev = [
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "uvicorn>=0.30.0",
    "SQLAlchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    "PyJWT[crypto]>=2.8.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "coverage>=7.7.0",
    "ruff>=0.5.0",
    "types-PyYAML>=6.0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["src/verification_core"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit security checks
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"] # Allow assert statements in pytest suite

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
strict = true
warn_unreachable = true
disallow_any_unimported = true
disallow_any_expr = false
files = ["src", "tests"]
