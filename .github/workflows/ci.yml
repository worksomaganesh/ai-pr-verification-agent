name: Phase 1A CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-1a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12 · lint, type-check, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format src tests

      - name: Commit formatter output temporarily for repository verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply Ruff formatting to Phase 1B implementation'
          git push origin HEAD:main

      - name: Upload formatter output for repository verification
        uses: actions/upload-artifact@v4
        with:
          name: phase1-formatted-source
          path: |
            src/
            tests/
          if-no-files-found: error

      - name: Lint
        run: ruff check src tests

      - name: Strict type checking
        run: mypy --strict src tests

      - name: Run unit and property-based tests with coverage
        run: pytest --cov=src/verification_core --cov-report=term-missing --cov-report=xml
