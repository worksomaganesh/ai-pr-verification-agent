name: Phase II CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12 · lint, type-check, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting without changing files
        run: ruff format --check src tests

      - name: Lint
        run: ruff check src tests

      - name: Strict type checking
        run: mypy --strict src tests

      - name: Run unit and property-based tests with coverage
        run: pytest --cov=src/verification_core --cov-report=term-missing --cov-report=xml

      - name: Enforce Phase I core coverage gate
        run: >-
          coverage report
          --include=src/verification_core/coverage.py,src/verification_core/domain/*,src/verification_core/evidence.py,src/verification_core/github_context.py,src/verification_core/ledger.py,src/verification_core/planning.py,src/verification_core/policy.py,src/verification_core/scenarios/*,src/verification_core/security.py,src/verification_core/webhooks.py
          --fail-under=95

      - name: Enforce Phase II integration coverage gate
        run: >-
          coverage report
          --include=src/verification_core/__main__.py,src/verification_core/asgi.py,src/verification_core/delivery_store.py,src/verification_core/gemini_planner.py,src/verification_core/github_app.py,src/verification_core/phase_two.py,src/verification_core/runtime.py,src/verification_core/webhook_app.py
          --fail-under=80
