name: Phase II CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12 · lint, type-check, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting without changing files
        run: ruff format --check src tests

      - name: Lint
        run: ruff check src tests

      - name: Strict type checking
        run: mypy --strict src tests

      - name: Run unit and property-based tests with coverage
        run: pytest --cov=src/verification_core --cov-report=term-missing --cov-report=xml
