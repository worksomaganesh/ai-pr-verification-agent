name: Phase II CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12 · lint, type-check, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting without changing files
        run: ruff format --check src tests

      - name: Lint
        run: ruff check src tests

      - name: Strict type checking
        run: mypy --strict src tests

      - name: Run unit and property-based tests with coverage
        run: pytest --cov=src/verification_core --cov-report=term-missing --cov-report=xml

      - name: Enforce overall coverage gate
        run: coverage report --fail-under=90

      - name: Enforce Phase I core coverage gate
        run: >-
          coverage report
          --include=src/verification_core/coverage.py,src/verification_core/domain/*,src/verification_core/evidence.py,src/verification_core/github_context.py,src/verification_core/ledger.py,src/verification_core/planning.py,src/verification_core/policy.py,src/verification_core/scenarios/*,src/verification_core/security.py,src/verification_core/webhooks.py
          --fail-under=95

      - name: Enforce Phase II integration coverage gate
        run: >-
          coverage report
          --include=src/verification_core/__main__.py,src/verification_core/asgi.py,src/verification_core/delivery_store.py,src/verification_core/gemini_planner.py,src/verification_core/github_app.py,src/verification_core/phase_two.py,src/verification_core/runtime.py,src/verification_core/run_ledger.py,src/verification_core/webhook_app.py
          --fail-under=80


  evidence:
    name: Produce authenticated evidence artifact (exact PR head)
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run PR-head tests with per-test coverage
        run: >-
          pytest --cov=src/verification_core --cov-context=test
          --junitxml=junit.xml --cov-report=term

      - name: Export per-test evidence manifest
        run: >-
          python -m verification_core.manifest_export
          --coverage-data .coverage --junit junit.xml
          --head-sha "${{ github.event.pull_request.head.sha }}"
          --output coverage-manifest.json

      - name: Upload verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-evidence
          path: |
            junit.xml
            coverage-manifest.json
          if-no-files-found: error
          retention-days: 7
